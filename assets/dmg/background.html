<!doctype html>
<!-- Source of truth for the DMG window background. Canvas size, icon slots and the
     white bleed margin are mirrored in scripts/make_dmg.sh; read docs/dmg.md first. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand: #0071e3;
    --ink: #1d1d1f;
    --muted: #86868b;
    --canvas-w: 660px;
    --canvas-h: 380px;
    --icon-y: 210px;
    --app-x: 170px;
    --drop-x: 490px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: var(--canvas-w);
    height: var(--canvas-h);
    overflow: hidden;
  }

  /* The outer edges must stay pure white: Finder draws this image at its natural size
     anchored top-left, so any Finder chrome the window gains leaves a white margin
     around it that has to be indistinguishable from the artwork. */
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(460px 300px at 50% 55%, rgba(0, 113, 227, 0.10) 0%, rgba(0, 113, 227, 0) 70%),
      radial-gradient(620px 360px at 50% 118%, rgba(29, 29, 31, 0.05) 0%, rgba(29, 29, 31, 0) 62%),
      #FFFFFF;
  }

  .header {
    position: absolute;
    top: 42px;
    left: 0;
    right: 0;
    text-align: center;
  }

  .title {
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.6px;
    color: var(--ink);
  }

  .subtitle {
    margin-top: 9px;
    font-size: 14px;
    letter-spacing: -0.1px;
    color: var(--muted);
  }

  .subtitle strong { font-weight: 590; color: #6e6e73; }

  .arrow {
    position: absolute;
    top: calc(var(--icon-y) - 24px);
    left: calc((var(--app-x) + var(--drop-x)) / 2 - 84px);
    width: 168px;
    height: 48px;
  }

  .footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11.5px;
    letter-spacing: 0.1px;
    color: #A1A1A6;
  }

  .footer .dot { padding: 0 7px; color: #C9C9CE; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Install Talkra</div>
    <div class="subtitle">Drag <strong>Talkra</strong> onto the <strong>Applications</strong> folder</div>
  </div>

  <svg class="arrow" viewBox="0 0 168 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="trail" x1="0" y1="0" x2="168" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0071e3" stop-opacity="0"/>
        <stop offset="0.45" stop-color="#0071e3" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#0071e3" stop-opacity="1"/>
      </linearGradient>
    </defs>
    <path d="M4 24H140" stroke="url(#trail)" stroke-width="5" stroke-linecap="round"/>
    <path d="M138 12L156 24L138 36" stroke="#0071e3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="footer">
    Talkra lives in your menu bar<span class="dot">•</span>Launch it from Applications after installing
  </div>
</body>
</html>
